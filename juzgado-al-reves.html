<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juzgado al Revés</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#2b1b3a;--wall:#1f6f78;--floor:#4a2e55;--gold:#f2b134;--cream:#fff4dc;--red:#d6423a;--ink:#1a1024;--box:#fff4dc;--boxtext:#1a1024;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#3a2650;--box:#fff8e8}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--cream);font-family:'Nunito',system-ui,sans-serif;font-weight:600;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
h1{font-family:'Lilita One',Impact,sans-serif;font-weight:400;font-size:22px;margin:0;color:var(--gold);letter-spacing:.5px}
#lvl{font-size:13px;background:var(--ink);padding:4px 10px;border-radius:12px}
#stage{flex:1;min-height:0;position:relative;background:linear-gradient(var(--wall) 0 62%,var(--floor) 62%);border-top:4px solid var(--ink);border-bottom:4px solid var(--ink);display:flex;align-items:flex-end;justify-content:space-around;padding:0 4px}
#stage::before{content:"⚖️";position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:34px;display:inline-block;rotate:180deg}
.ch{width:23%;transition:transform .25s,filter .25s;filter:brightness(.55) saturate(.7);transform-origin:bottom}
.ch.on{transform:scale(1.18);filter:none;z-index:2}
.ch svg{width:100%;display:block}
#box{background:var(--box);color:var(--boxtext);margin:12px;border-radius:14px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--gold);padding:12px 14px;min-height:150px}
#who{font-family:'Lilita One',Impact,sans-serif;font-weight:400;font-size:17px;color:var(--red);margin-bottom:4px}
#txt{font-size:16px;line-height:1.4;min-height:66px}
#opts{display:flex;flex-direction:column;gap:7px;margin-top:8px}
button{font:inherit;font-weight:800;border:3px solid var(--ink);background:var(--gold);color:var(--ink);border-radius:10px;padding:9px 12px;text-align:left;cursor:pointer;min-height:44px}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button.ok{background:#7fd18b}button.no{background:#f08a82}
#next{align-self:flex-end;margin-top:6px;text-align:center}
.hint{font-size:12px;opacity:.7;text-align:right;margin-top:4px}
</style>
</head>
<body>
<div id="app">
<header><h1>Juzgado al Revés</h1><span id="lvl">Nivel 1 · Derechos básicos</span></header>
<div id="stage" aria-label="Escena del juzgado"></div>
<div id="box" aria-live="polite"><div id="who"></div><div id="txt"></div><div id="opts"></div></div>
</div>
<script>
const skin={j:'#e0a97a',a:'#c98a5e',c:'#b87a55',p:'#d9a07a'};
const art={
// Juez: traje impecable, corbata roja, cara de sinvergüenza
j:`<rect x="14" y="100" width="92" height="60" rx="18" fill="#1d2b4f"/><path d="M48 100l12 26 12-26z" fill="#fff"/><path d="M56 104h8l4 40-8 8-8-8z" fill="#d6423a"/><path d="M30 108q30 30 60 0" fill="none" stroke="#f2b134" stroke-width="4"/>
<circle cx="60" cy="62" r="30" fill="${skin.j}"/><path d="M30 56q4-32 32-30 28-2 30 30-10-16-30-16T30 56z" fill="#15131c"/>
<path d="M42 56q7-4 14 0M66 52q8-6 15 0" stroke="#15131c" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M42 62q7 5 14 0M66 62q7 5 14 0" stroke="#15131c" stroke-width="3" fill="none"/><circle cx="49" cy="63" r="2.5" fill="#15131c"/><circle cx="73" cy="63" r="2.5" fill="#15131c"/>
<path d="M44 80q18 12 34-6" stroke="#15131c" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M78 74l4-3" stroke="#15131c" stroke-width="3"/>`,
// Abogado: malandro mal vestido
a:`<rect x="12" y="100" width="96" height="60" rx="14" fill="#6b6b5a"/><path d="M48 100l12 22 12-22z" fill="#d8d2bf"/><path d="M58 106l10 4-4 36-10-4z" fill="#3c8a52"/><rect x="22" y="126" width="16" height="14" fill="#a05a3c" stroke="#222" stroke-dasharray="3 2"/><path d="M84 112l10 8-12 4z" fill="#3a3a30"/>
<circle cx="60" cy="62" r="30" fill="${skin.a}"/><path d="M28 54l6-8 4 6 6-10 6 8 6-10 6 10 8-8 4 10 8-6 6 8q-6-18-30-18T28 54z" fill="#2a1c12"/>
<path d="M40 54l16 6M80 54l-16 6" stroke="#2a1c12" stroke-width="4" stroke-linecap="round"/><circle cx="49" cy="64" r="4" fill="#fff"/><circle cx="73" cy="64" r="4" fill="#fff"/><circle cx="50" cy="65" r="2" fill="#15131c"/><circle cx="72" cy="65" r="2" fill="#15131c"/>
<path d="M40 78q20 20 42 0z" fill="#fff" stroke="#15131c" stroke-width="3"/><rect x="58" y="80" width="5" height="6" fill="#f2b134"/><g fill="#2a1c12" opacity=".5"><circle cx="40" cy="82" r="1.3"/><circle cx="46" cy="88" r="1.3"/><circle cx="76" cy="88" r="1.3"/><circle cx="82" cy="82" r="1.3"/></g>`,
// Acusado: vestido de mendigo
c:`<rect x="16" y="100" width="88" height="60" rx="16" fill="#7a5a3a"/><rect x="30" y="116" width="18" height="16" fill="#a08050" stroke="#2a1c12" stroke-dasharray="3 2"/><path d="M70 104l6 20-8-4z" fill="#5c4228"/><path d="M92 128h14l-3 14h-8z" fill="#bfbfbf" stroke="#222" stroke-width="2"/>
<circle cx="60" cy="62" r="30" fill="${skin.c}"/><path d="M26 50q34-34 68 0l-10 6q-24-10-48 0z" fill="#8b7355"/><ellipse cx="42" cy="44" rx="5" ry="3" fill="${skin.c}"/><path d="M24 52h72" stroke="#6b5a40" stroke-width="5"/>
<circle cx="49" cy="64" r="6" fill="#fff"/><circle cx="73" cy="64" r="6" fill="#fff"/><circle cx="50" cy="66" r="3" fill="#15131c"/><circle cx="72" cy="66" r="3" fill="#15131c"/><path d="M40 54l14-4M82 54l-14-4" stroke="#2a1c12" stroke-width="3" stroke-linecap="round"/>
<path d="M50 86q10-8 20 0" stroke="#15131c" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M80 70q3 7 0 10" stroke="#6ab7ff" stroke-width="3" fill="none"/>`,
// Policía: de ladrón, con antifaz y bolsa de dinero
p:`<rect x="14" y="100" width="92" height="60" rx="16" fill="#f4f4f4"/><g fill="#15131c"><rect x="14" y="108" width="92" height="7"/><rect x="14" y="124" width="92" height="7"/><rect x="14" y="140" width="92" height="7"/></g><circle cx="94" cy="132" r="15" fill="#4f8a4b" stroke="#15131c" stroke-width="3"/><text x="94" y="138" font-size="18" text-anchor="middle" fill="#fff4dc" font-family="Lilita One,Impact">$</text>
<circle cx="60" cy="62" r="30" fill="${skin.p}"/><path d="M30 46q30-34 60 0z" fill="#1b3a6b"/><rect x="26" y="42" width="68" height="9" rx="4" fill="#142a4f"/><circle cx="60" cy="40" r="6" fill="#f2b134"/>
<rect x="31" y="54" width="58" height="18" rx="9" fill="#15131c"/><circle cx="48" cy="63" r="5" fill="#fff"/><circle cx="72" cy="63" r="5" fill="#fff"/><circle cx="50" cy="63" r="2.2" fill="#15131c"/><circle cx="74" cy="63" r="2.2" fill="#15131c"/>
<path d="M44 80q16 14 32 0" stroke="#15131c" stroke-width="3.5" fill="none" stroke-linecap="round"/>`
};
const names={j:'Juez Don Cuello',a:'Licenciado Chueco',c:'El Acusado',p:'Oficial Mano Larga'};
const stage=document.getElementById('stage');
for(const k of 'cajp'){const d=document.createElement('div');d.className='ch';d.id='ch-'+k;d.innerHTML=`<svg viewBox="0 0 120 160" role="img" aria-label="${names[k]}">${art[k]}</svg>`;stage.appendChild(d)}

const script=[
 {w:'j',t:'¡Orden en la sala! Aquí en el Juzgado al Revés todo parece mentira… pero las leyes que vas a aprender son de verdad.'},
 {w:'p',t:'Yo soy el policía. Sí, me veo raro, pero tú no te fíes de las caras: fíjate en lo que dice la ley.'},
 {w:'a',t:'Y yo soy el abogado. Te explico todo en palabras fáciles, sin tanto lenguaje de libro. Tú solo pon atención.'},
 {w:'c',t:'Yo soy el acusado, y necesito que alguien me explique mis derechos. ¿Me ayudas?'},
 {w:'j',t:'Lección 1. La Constitución de Honduras dice que el derecho a la vida es inviolable (Art. 65). Quiere decir: nadie tiene derecho a quitarle la vida a otra persona.'},
 {w:'a',t:'¿Por qué importa? Porque sin vida no hay ningún otro derecho. Por eso es el primero y el más protegido. ¿Cuándo aplica? Siempre y para todos, sin excepción.'},
 {q:true,w:'c',t:'Práctica 1 de 10: ¿Qué significa que el derecho a la vida es "inviolable"?',o:['Que solo se respeta a veces','Que nadie puede quitárselo a otra persona','Que solo aplica a los ricos'],c:1,why:'Inviolable = no se puede romper ni pasar por encima. Protege a todas las personas.'},
 {q:true,w:'p',t:'Práctica 2 de 10: ¿A quién protege este derecho?',o:['A todas las personas','Solo a los policías','Solo a quienes no tienen antecedentes'],c:0,why:'Es para todas las personas. La cara o la ropa no cambian nada.'},
 {w:'j',t:'Así se juega: lección corta, 10 prácticas y, si las apruebas, subes de nivel hasta llegar al Código Penal. Esto es solo la prueba de cómo se ve el juego.'}
];
let i=0,timer,typing=false,full='';
const who=document.getElementById('who'),txt=document.getElementById('txt'),opts=document.getElementById('opts'),box=document.getElementById('box');
function show(){
 const s=script[i];opts.innerHTML='';
 document.querySelectorAll('.ch').forEach(c=>c.classList.remove('on'));
 document.getElementById('ch-'+s.w).classList.add('on');
 who.textContent=names[s.w];full=s.t;txt.textContent='';let n=0;typing=true;clearInterval(timer);
 timer=setInterval(()=>{txt.textContent=full.slice(0,++n);if(n>=full.length)done()},18);
}
function done(){
 clearInterval(timer);typing=false;txt.textContent=full;const s=script[i];
 if(s.q){s.o.forEach((o,k)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(b,k);opts.appendChild(b)})}
 else{const b=document.createElement('button');b.id='next';b.textContent=i<script.length-1?'Seguir':'Volver a empezar';b.onclick=()=>{i=(i+1)%script.length;show()};opts.appendChild(b)}
}
function answer(b,k){
 const s=script[i];[...opts.children].forEach(x=>x.disabled=true);
 const good=k===s.c;b.classList.add(good?'ok':'no');if(!good)opts.children[s.c].classList.add('ok');
 const f=document.createElement('div');f.className='hint';f.style.textAlign='left';f.style.opacity=1;f.textContent=(good?'¡Bien! ':'Casi. ')+s.why;opts.appendChild(f);
 const n=document.createElement('button');n.id='next';n.textContent='Seguir';n.onclick=()=>{i++;show()};opts.appendChild(n);
}
box.addEventListener('click',e=>{if(typing&&e.target.tagName!=='BUTTON')done()});
show();
</script>
</body>
</html>
